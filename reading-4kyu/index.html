<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ViLT 4級 読解</title>
<link rel="stylesheet" href="../assets/common.css">
<style>
.intro{background:#e1f5fe;border:1px solid #4fc3f7;border-radius:10px;padding:12px;margin-bottom:14px;font-size:12px;color:#01579b;line-height:1.7}
.level-sel{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
.level-sel button{background:#fff;border:2px solid #e0e0e0;border-radius:10px;padding:14px 8px;font-size:13px;font-weight:700;color:#333;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80px}
.level-sel button.l1{border-color:#4caf50}
.level-sel button.l2{border-color:#ff9800}
.level-sel button.l3{border-color:#f44336}
.level-sel button.all{grid-column:span 2;border-color:#0277bd;background:linear-gradient(135deg,#e1f5fe,#fff);color:#01579b}
.level-sel button.done{background:#e8f5e9;border-color:#2e7d32;color:#1b5e20}
.level-sel button .count{font-size:11px;color:#888;margin-top:4px;display:block;font-weight:500}
.round-bar{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-around;align-items:center;font-size:12px;color:#666}
.round-bar b{display:block;font-size:17px;color:#da251d;font-weight:700;margin-top:2px}
.round-bar .sep{width:1px;height:30px;background:#e0e0e0}
.passage-box{background:#fff;border:2px solid #0277bd;border-radius:14px;padding:16px;margin-bottom:14px}
.passage-box .meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:11px;color:#0277bd;font-weight:700;letter-spacing:1px}
.passage-box .level-badge{display:inline-block;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700}
.level-badge.l1{background:#e8f5e9;color:#2e7d32}
.level-badge.l2{background:#fff3e0;color:#ef6c00}
.level-badge.l3{background:#ffebee;color:#c62828}
.passage-box .passage{font-size:15px;color:#222;line-height:1.8;white-space:pre-wrap;background:#fafbff;padding:12px;border-radius:8px;border:1px solid #e0e0e0}
.passage-box .speak-line{margin-top:8px;text-align:right}
.btn-speak-small{background:#e3f2fd;color:#1976d2;border:1px solid #1976d2;border-radius:8px;padding:6px 12px;font-size:12px;cursor:pointer;font-family:inherit}
.btn-speak-small.speaking{background:#1976d2;color:#fff}
.q-card{background:#fff;border:2px solid #e0e0e0;border-radius:12px;padding:14px;margin-bottom:12px}
.q-card .q-num{display:inline-block;background:#0277bd;color:#fff;border-radius:50%;width:28px;height:28px;line-height:28px;text-align:center;font-weight:700;font-size:13px;margin-right:8px}
.q-card .q-text{font-size:14px;font-weight:600;color:#222;margin-bottom:10px;line-height:1.5;display:flex;align-items:flex-start}
.q-card .q-text-body{flex:1}
.choices{display:flex;flex-direction:column;gap:6px}
.choices button{padding:12px;background:#fff;border:2px solid #e0e0e0;border-radius:10px;font-size:13px;text-align:left;cursor:pointer;font-family:inherit;color:#333;display:flex;align-items:flex-start;line-height:1.4}
.choices button:active{transform:scale(.98)}
.choices button .label{font-weight:700;color:#0277bd;margin-right:8px;flex-shrink:0;width:18px}
.choices button.selected{border-color:#0277bd;background:#e1f5fe}
.choices button.correct{border-color:#2e7d32;background:#c8e6c9;color:#1b5e20}
.choices button.correct .label{color:#1b5e20}
.choices button.wrong{border-color:#c62828;background:#ffcdd2;color:#b71c1c}
.choices button.wrong .label{color:#b71c1c}
.choices button.disabled{cursor:not-allowed;opacity:.85}
.explanation{background:#fff8e6;border:1px solid #ffd666;border-radius:8px;padding:10px;font-size:12px;color:#8b6914;margin-top:8px;line-height:1.6;display:none}
.explanation.show{display:block}
.judge-final{border-radius:12px;padding:16px;margin-bottom:14px;text-align:center;display:none}
.judge-final.show{display:block}
.judge-final.excellent{background:linear-gradient(135deg,#2e7d32,#43a047);color:#fff}
.judge-final.partial{background:linear-gradient(135deg,#ffa726,#fb8c00);color:#fff}
.judge-final.wrong{background:linear-gradient(135deg,#ef5350,#e53935);color:#fff}
.judge-final .icon{font-size:42px;font-weight:800;display:block;margin-bottom:4px;line-height:1}
.judge-final .msg{font-size:14px;opacity:.95}
.btn-row{display:flex;gap:10px;margin-bottom:10px}
.btn-row button{flex:1;padding:14px 8px;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-row button:active{opacity:.75;transform:scale(.96)}
.btn-check{background:#0277bd;color:#fff}
.btn-next{background:#2e7d32;color:#fff}
.btn-skip{background:#f5f5f5;color:#666;border:1px solid #ddd!important}
.voice-info{background:#e3f2fd;border:1px solid #64b5f6;border-radius:8px;padding:8px 12px;font-size:12px;color:#1565c0;margin-bottom:10px}
.voice-info.warn{background:#fff3e0;border-color:#ffb74d;color:#e65100}
.voice-info.err{background:#ffebee;border-color:#e57373;color:#c62828}
.complete{background:linear-gradient(135deg,#4caf50,#8bc34a);color:#fff;border-radius:16px;padding:40px 20px;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.complete h2{font-size:28px;margin-bottom:8px}
.complete p{font-size:14px;opacity:.95;margin-bottom:16px}
.complete button{background:#fff;color:#2e7d32;border:none;padding:12px 24px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.reset-bar{display:flex;gap:8px;margin-top:12px}
.reset-bar button{flex:1;padding:8px;background:none;border:1px solid #ccc;border-radius:8px;color:#888;font-size:11px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="app">
<header class="site">
<button class="nav-back" onclick="location.href='../'">← ホーム</button>
<h1>4級 読解</h1>
<div class="sub">段落+設問 (4択選択式)</div>
</header>
<main>

<div id="introArea">
<div class="intro">
<b>📖 読解問題の進め方</b><br>
1. 段落をよく読む（音声で読み上げも可）<br>
2. 各設問について4つの選択肢から選ぶ<br>
3. 「答え合わせ」で正誤判定+解説<br>
<b>判定</b>: ◎全問正解 / △一部正解 / ×全問不正解<br>
全問正解(◎)で次周に出ません。
</div>
<div class="voice-info" id="voiceInfo">🔊 音声エンジン確認中...</div>
<div class="section-title">レベルを選択</div>
<div class="level-sel" id="levelSel"></div>
<div class="reset-bar">
<button id="btnResetAll">全進捗リセット</button>
</div>
</div>

<div id="learnArea" class="hidden">
<div class="round-bar">
<div>周回<b id="s-round">1 / 5</b></div>
<div class="sep"></div>
<div>残り<b id="s-remain">-</b></div>
<div class="sep"></div>
<div>習得(◎)<b id="s-done">-</b></div>
</div>

<div class="passage-box">
<div class="meta">
<span id="qNo">第-問</span>
<span class="level-badge" id="levelBadge">-</span>
</div>
<div class="passage" id="passage">-</div>
<div class="speak-line">
<button class="btn-speak-small" id="btnSpeakPassage">🔊 段落を読み上げ</button>
</div>
</div>

<div id="questionsArea"></div>

<div class="judge-final" id="judgeFinal">
<span class="icon" id="judgeIcon">✓</span>
<div class="msg" id="judgeMsg"></div>
</div>

<div class="btn-row" id="btnsBefore">
<button class="btn-skip" id="btnSkip">わからない</button>
<button class="btn-check" id="btnCheck">答え合わせ</button>
</div>
<div class="btn-row hidden" id="btnsAfter">
<button class="btn-next" id="btnNext">次の問題 ▶</button>
</div>

<div class="progress"><div class="progress-bar" id="bar" style="width:0%"></div></div>
<div class="reset-bar">
<button id="btnBack">← レベル選択</button>
<button id="btnResetCur">このレベルをリセット</button>
</div>
</div>

<div id="completeArea" class="complete hidden">
<h2>🎉 完了！</h2>
<p id="completeMsg">読解完了</p>
<button onclick="location.reload()">レベル選択に戻る</button>
</div>

</main>
<footer class="site">読解は本番試験の最重要セクション</footer>
</div>

<script src="data.js"></script>
<script>
(function(){
  var MAX_ROUND = 5;
  var state = null, rank = null, currentLevel = null;
  var userAnswers = {}; // qIdx -> chosenIdx
  var ALL_KEY = "_ALL_";

  function filterByLevel(lv){
    if(lv === ALL_KEY) return READING_4KYU.map(function(_,i){return i;});
    return READING_4KYU.map(function(q,i){return q.level === lv ? i : -1;}).filter(function(i){return i >= 0;});
  }

  function skey(lv){ return "vilt_reading4kyu_lv"+lv; }
  function loadSt(lv){ try{ var s = localStorage.getItem(skey(lv)); if(s) return JSON.parse(s); }catch(e){} return null; }
  function saveSt(lv, st){ try{ localStorage.setItem(skey(lv), JSON.stringify(st)); }catch(e){} }
  function initSt(lv){
    var list = filterByLevel(lv);
    return { round:1, queue:list.slice(), nextQueue:[], done:[], idx:0, finished:false, total:list.length };
  }

  // ===== Voice =====
  var viVoice = null;
  function loadVoices(){
    var v = window.speechSynthesis.getVoices();
    viVoice = v.find(function(x){ return x.lang && x.lang.toLowerCase().indexOf("vi") === 0; });
    var el = document.getElementById("voiceInfo");
    if(!("speechSynthesis" in window)){ el.className="voice-info err"; el.textContent="❌ 音声未対応"; return; }
    if(viVoice){ el.className="voice-info"; el.innerHTML="✅ 音声: <b>"+viVoice.name+"</b>"; }
    else{ el.className="voice-info warn"; el.innerHTML="⚠️ ベトナム語音声なし"; }
  }
  function speak(text, btn){
    if(!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    var msg = new SpeechSynthesisUtterance(text);
    msg.lang="vi-VN"; msg.rate=0.85;
    if(viVoice) msg.voice = viVoice;
    if(btn) btn.classList.add("speaking");
    msg.onend = function(){ if(btn) btn.classList.remove("speaking"); };
    msg.onerror = function(){ if(btn) btn.classList.remove("speaking"); };
    window.speechSynthesis.speak(msg);
  }

  function renderLevelSel(){
    var el = document.getElementById("levelSel");
    el.innerHTML = "";
    var all = filterByLevel(ALL_KEY);
    var allBtn = document.createElement("button");
    allBtn.className = "all";
    var allSt = loadSt(ALL_KEY);
    allBtn.innerHTML = "🎯 全レベル通し<span class='count'>◎ "+(allSt?allSt.done.length:0)+" / "+all.length+" 題</span>";
    allBtn.addEventListener("click", function(){ start(ALL_KEY); });
    el.appendChild(allBtn);
    [1,2,3].forEach(function(lv){
      var list = filterByLevel(lv);
      var st = loadSt(lv);
      var doneCount = st ? st.done.length : 0;
      var btn = document.createElement("button");
      btn.className = "l"+lv + (st && st.finished && doneCount === list.length ? " done" : "");
      var label = lv === 1 ? "Lv1 短文" : lv === 2 ? "Lv2 中文" : "Lv3 長文";
      btn.innerHTML = label + "<span class='count'>◎ "+doneCount+" / "+list.length+"</span>";
      btn.addEventListener("click", function(){ start(lv); });
      el.appendChild(btn);
    });
  }

  function start(lv){
    currentLevel = lv;
    state = loadSt(lv) || initSt(lv);
    if(state.finished){ state = initSt(lv); saveSt(lv, state); }
    document.getElementById("introArea").classList.add("hidden");
    document.getElementById("learnArea").classList.remove("hidden");
    document.getElementById("completeArea").classList.add("hidden");
    render();
  }
  function back(){
    currentLevel = null; state = null;
    document.getElementById("introArea").classList.remove("hidden");
    document.getElementById("learnArea").classList.add("hidden");
    document.getElementById("completeArea").classList.add("hidden");
    renderLevelSel();
  }

  function curQ(){
    if(!state || state.queue.length === 0) return null;
    return READING_4KYU[state.queue[state.idx]];
  }

  function render(){
    if(state.finished){ showComplete(); return; }
    var q = curQ(); if(!q) return;
    document.getElementById("qNo").textContent = "第"+q.n+"題";
    var lb = document.getElementById("levelBadge");
    lb.className = "level-badge l" + q.level;
    lb.textContent = (q.level === 1 ? "Lv1 短文" : q.level === 2 ? "Lv2 中文" : "Lv3 長文") + " | " + q.category;
    document.getElementById("passage").textContent = q.passage;
    document.getElementById("s-round").textContent = state.round+" / "+MAX_ROUND;
    document.getElementById("s-remain").textContent = state.queue.length;
    document.getElementById("s-done").textContent = state.done.length+" / "+state.total;
    document.getElementById("bar").style.width = Math.round((state.done.length/state.total)*100)+"%";

    userAnswers = {};
    var area = document.getElementById("questionsArea");
    area.innerHTML = "";
    q.questions.forEach(function(question, qi){
      var card = document.createElement("div");
      card.className = "q-card";
      var labels = ["A","B","C","D"];
      card.innerHTML = "<div class='q-text'><span class='q-num'>"+(qi+1)+"</span><span class='q-text-body'>"+question.q+"</span></div>";
      var choices = document.createElement("div");
      choices.className = "choices";
      question.choices.forEach(function(c, ci){
        var btn = document.createElement("button");
        btn.innerHTML = "<span class='label'>"+labels[ci]+"</span><span>"+c+"</span>";
        btn.addEventListener("click", function(){
          if(btn.classList.contains("disabled")) return;
          // Clear previous selection in this question
          choices.querySelectorAll("button").forEach(function(b){ b.classList.remove("selected"); });
          btn.classList.add("selected");
          userAnswers[qi] = ci;
        });
        choices.appendChild(btn);
      });
      card.appendChild(choices);
      var exp = document.createElement("div");
      exp.className = "explanation";
      exp.innerHTML = "<b>解説:</b> "+ (question.explanation || "");
      card.appendChild(exp);
      area.appendChild(card);
    });

    document.getElementById("judgeFinal").classList.remove("show");
    document.getElementById("btnsBefore").classList.remove("hidden");
    document.getElementById("btnsAfter").classList.add("hidden");
    rank = null;
    window.scrollTo(0, 0);
  }

  function showComplete(){
    document.getElementById("learnArea").classList.add("hidden");
    document.getElementById("completeArea").classList.remove("hidden");
    document.getElementById("completeMsg").textContent =
      state.done.length === state.total
        ? "全"+state.total+"題を ◎ で完了！"
        : MAX_ROUND+"周終了。◎ "+state.done.length+"/"+state.total+"題";
  }

  function doCheck(){
    var q = curQ(); if(!q) return;
    // Check that all questions answered
    if(Object.keys(userAnswers).length < q.questions.length){
      alert("全ての設問に回答してください");
      return;
    }
    var correctCount = 0;
    var area = document.getElementById("questionsArea");
    var qCards = area.querySelectorAll(".q-card");
    q.questions.forEach(function(question, qi){
      var card = qCards[qi];
      var choiceBtns = card.querySelectorAll(".choices button");
      var userChoice = userAnswers[qi];
      var correctIdx = question.ans;
      choiceBtns.forEach(function(b, ci){
        b.classList.add("disabled");
        b.classList.remove("selected");
        if(ci === correctIdx) b.classList.add("correct");
        if(ci === userChoice && userChoice !== correctIdx) b.classList.add("wrong");
      });
      if(userChoice === correctIdx) correctCount++;
      card.querySelector(".explanation").classList.add("show");
    });

    var total = q.questions.length;
    var jb = document.getElementById("judgeFinal");
    if(correctCount === total){ rank = "◎"; jb.className="judge-final show excellent";
      document.getElementById("judgeIcon").textContent="◎";
      document.getElementById("judgeMsg").textContent="全問正解！("+correctCount+"/"+total+") 合格";
    }else if(correctCount > 0){ rank = "△"; jb.className="judge-final show partial";
      document.getElementById("judgeIcon").textContent="△";
      document.getElementById("judgeMsg").textContent="一部正解 ("+correctCount+"/"+total+") → 次周";
    }else{ rank = "×"; jb.className="judge-final show wrong";
      document.getElementById("judgeIcon").textContent="×";
      document.getElementById("judgeMsg").textContent="全問不正解 (0/"+total+") → 次周";
    }

    document.getElementById("btnsBefore").classList.add("hidden");
    document.getElementById("btnsAfter").classList.remove("hidden");
  }

  function doSkip(){
    var q = curQ(); if(!q) return;
    rank = "×";
    var area = document.getElementById("questionsArea");
    var qCards = area.querySelectorAll(".q-card");
    q.questions.forEach(function(question, qi){
      var card = qCards[qi];
      var choiceBtns = card.querySelectorAll(".choices button");
      var correctIdx = question.ans;
      choiceBtns.forEach(function(b, ci){
        b.classList.add("disabled");
        if(ci === correctIdx) b.classList.add("correct");
      });
      card.querySelector(".explanation").classList.add("show");
    });
    var jb = document.getElementById("judgeFinal");
    jb.className="judge-final show wrong";
    document.getElementById("judgeIcon").textContent="?";
    document.getElementById("judgeMsg").textContent="スキップ → 次周";
    document.getElementById("btnsBefore").classList.add("hidden");
    document.getElementById("btnsAfter").classList.remove("hidden");
  }

  function doNext(){
    var qi = state.queue[state.idx];
    if(rank === "◎"){ if(state.done.indexOf(qi) < 0) state.done.push(qi); }
    else{ if(state.nextQueue.indexOf(qi) < 0) state.nextQueue.push(qi); }
    state.queue.splice(state.idx, 1);
    if(state.idx >= state.queue.length){
      if(state.nextQueue.length === 0 || state.round >= MAX_ROUND) state.finished = true;
      else{ state.round++; state.queue = state.nextQueue; state.nextQueue = []; state.idx = 0; }
    }
    saveSt(currentLevel, state);
    render();
  }

  document.getElementById("btnSpeakPassage").addEventListener("click", function(){
    var q = curQ(); if(q) speak(q.passage, document.getElementById("btnSpeakPassage"));
  });
  document.getElementById("btnCheck").addEventListener("click", doCheck);
  document.getElementById("btnSkip").addEventListener("click", doSkip);
  document.getElementById("btnNext").addEventListener("click", doNext);
  document.getElementById("btnBack").addEventListener("click", back);
  document.getElementById("btnResetCur").addEventListener("click", function(){
    if(confirm("このレベルをリセット?")){ state = initSt(currentLevel); saveSt(currentLevel, state); render(); }
  });
  document.getElementById("btnResetAll").addEventListener("click", function(){
    if(confirm("全進捗リセット?")){
      [ALL_KEY,1,2,3].forEach(function(l){ localStorage.removeItem(skey(l)); });
      renderLevelSel();
    }
  });

  if("speechSynthesis" in window){
    loadVoices();
    if(window.speechSynthesis.onvoiceschanged !== undefined){
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }
  }
  renderLevelSel();
})();
</script>
</body>
</html>
