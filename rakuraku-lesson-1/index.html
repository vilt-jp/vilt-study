<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>らくらくベトナム語 ViLT 4級対策 #1</title>
<link rel="stylesheet" href="../assets/common.css">
<style>
.intro{background:#fff3e0;border:1px solid #ffb74d;border-radius:10px;padding:12px;margin-bottom:14px;font-size:12px;color:#e65100;line-height:1.7}
.mode-sel{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.mode-sel button{background:#fff;border:2px solid #e0e0e0;border-radius:12px;padding:14px 8px;font-size:13px;font-weight:700;color:#333;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:80px}
.mode-sel button:active{transform:scale(.97)}
.mode-sel button.all{grid-column:span 2;border-color:#ef6c00;background:linear-gradient(135deg,#fff3e0,#fff);color:#e65100}
.mode-sel button.done{background:#e8f5e9;border-color:#2e7d32;color:#1b5e20}
.mode-sel button .ic{font-size:22px;margin-bottom:4px}
.mode-sel button .count{font-size:11px;color:#888;margin-top:3px;font-weight:500}
.round-bar{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:10px 14px;margin-bottom:12px;display:flex;justify-content:space-around;align-items:center;font-size:12px;color:#666}
.round-bar b{display:block;font-size:17px;color:#da251d;font-weight:700;margin-top:2px}
.round-bar .sep{width:1px;height:30px;background:#e0e0e0}
.q-area{background:#fff;border:2px solid #e0e0e0;border-radius:14px;padding:16px;margin-bottom:14px}
.q-area .qmeta{display:flex;justify-content:space-between;font-size:11px;color:#888;font-weight:700;letter-spacing:1px;margin-bottom:8px}
.q-area .qlabel{font-size:11px;color:#888;margin-bottom:8px;font-weight:600}
.q-area .qsentence{font-size:17px;color:#222;line-height:1.7;margin-bottom:8px}
.q-area .qsentence .blank{color:#da251d;background:#fff8e6;padding:2px 14px;border-radius:6px;border:1px dashed #da251d;margin:0 2px}
.q-area .qsentence .ul{text-decoration:underline;text-decoration-color:#da251d;text-decoration-thickness:2px}
.q-area .qkeyword{font-size:30px;font-weight:800;color:#ef6c00;text-align:center;margin:8px 0;letter-spacing:2px}
.q-area .qkeyword-jp{font-size:13px;color:#888;text-align:center;margin-bottom:8px}
.q-area .qjp{font-size:13px;color:#666;background:#f8f8f8;padding:8px;border-radius:6px;line-height:1.6;display:none}
.q-area.revealed .qjp{display:block}
.choices{display:flex;flex-direction:column;gap:8px;margin-bottom:14px}
.choices button{padding:14px;background:#fff;border:2px solid #e0e0e0;border-radius:10px;font-size:14px;text-align:left;cursor:pointer;font-family:inherit;color:#333;display:flex;align-items:flex-start;line-height:1.5}
.choices button:active{transform:scale(.98)}
.choices button .label{font-weight:700;color:#ef6c00;margin-right:10px;flex-shrink:0;width:24px;font-size:15px}
.choices button.selected{border-color:#ef6c00;background:#fff3e0}
.choices button.correct{border-color:#2e7d32;background:#c8e6c9;color:#1b5e20}
.choices button.correct .label{color:#1b5e20}
.choices button.wrong{border-color:#c62828;background:#ffcdd2;color:#b71c1c}
.choices button.wrong .label{color:#b71c1c}
.choices button.disabled{cursor:not-allowed;opacity:.85}
.choices button .body{flex:1}
.choices button .body small{display:block;font-size:11px;color:#888;margin-top:4px;font-weight:400}
.choices button.correct .body small{color:#2e7d32}
.choices button.wrong .body small{color:#c62828}
.judge-box{border-radius:12px;padding:16px;margin-bottom:14px;text-align:center;display:none}
.judge-box.show{display:block}
.judge-box.correct{background:linear-gradient(135deg,#2e7d32,#43a047);color:#fff}
.judge-box.wrong{background:linear-gradient(135deg,#ef5350,#e53935);color:#fff}
.judge-box .icon{font-size:42px;font-weight:800;display:block;margin-bottom:4px;line-height:1}
.judge-box .msg{font-size:14px;opacity:.95;margin-bottom:8px}
.judge-box .correct-display{background:rgba(255,255,255,.25);border-radius:8px;padding:10px;font-size:14px;font-weight:600;line-height:1.5;text-align:left;margin-top:6px}
.explanation{background:#fff8e6;border:1px solid #ffd666;border-radius:10px;padding:12px;font-size:13px;color:#8b6914;margin-bottom:14px;line-height:1.7;display:none}
.explanation.show{display:block}
.explanation b{color:#ef6c00}
.btn-row{display:flex;gap:10px;margin-bottom:10px}
.btn-row button{flex:1;padding:16px 8px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-row button:active{opacity:.75;transform:scale(.96)}
.btn-row button:disabled{opacity:.4}
.btn-check{background:#ef6c00;color:#fff}
.btn-next{background:#2e7d32;color:#fff}
.btn-skip{background:#f5f5f5;color:#666;border:1px solid #ddd!important}
.btn-speak{background:#e3f2fd;color:#1976d2;border:2px solid #1976d2!important;font-size:13px!important;padding:10px 8px!important;flex:0 0 auto;width:90px}
.btn-speak.speaking{background:#1976d2;color:#fff}
.voice-info{background:#e3f2fd;border:1px solid #64b5f6;border-radius:8px;padding:8px 12px;font-size:12px;color:#1565c0;margin-bottom:10px}
.voice-info.warn{background:#fff3e0;border-color:#ffb74d;color:#e65100}
.voice-info.err{background:#ffebee;border-color:#e57373;color:#c62828}
.complete{background:linear-gradient(135deg,#4caf50,#8bc34a);color:#fff;border-radius:16px;padding:40px 20px;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.1)}
.complete h2{font-size:28px;margin-bottom:8px}
.complete p{font-size:14px;opacity:.95;margin-bottom:16px}
.complete button{background:#fff;color:#2e7d32;border:none;padding:12px 24px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit}
.reset-bar{display:flex;gap:8px;margin-top:12px}
.reset-bar button{flex:1;padding:8px;background:none;border:1px solid #ccc;border-radius:8px;color:#888;font-size:11px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<div class="app">
<header class="site">
<button class="nav-back" onclick="location.href='../'">← ホーム</button>
<h1>らくらくベトナム語 #1</h1>
<div class="sub">ViLT 試験直前対策ライブ - 4級</div>
</header>
<main>

<div id="modeArea">
<div class="intro">
<b>📺 らくらくベトナム語 動画 #1 から取得</b><br>
動画内の問題と解答を全58問アプリ化。動画と同じ4択タップ形式で解けます。<br>
<b>判定</b>: ◎正解→次周に出ない / ×不正解→次周に残る / 5周式
</div>
<div class="voice-info" id="voiceInfo">🔊 音声エンジン確認中...</div>
<div class="section-title">モードを選択</div>
<div class="mode-sel" id="modeMenu"></div>
<div class="reset-bar">
<button id="btnResetAll">全進捗リセット</button>
</div>
</div>

<div id="learnArea" class="hidden">
<div class="round-bar">
<div>周回<b id="s-round">1 / 5</b></div>
<div class="sep"></div>
<div>残り<b id="s-remain">-</b></div>
<div class="sep"></div>
<div>習得(◎)<b id="s-done">-</b></div>
</div>

<div class="q-area" id="qArea">
<div class="qmeta">
<span id="qNo">第-問</span>
<span id="qModeBadge">-</span>
</div>
<div id="qBody"></div>
<div class="qjp" id="qJp">-</div>
</div>

<div class="choices" id="choices"></div>

<div class="judge-box" id="judge">
<span class="icon" id="judgeIcon">✓</span>
<div class="msg" id="judgeMsg"></div>
<div class="correct-display" id="correctDisplay"></div>
</div>

<div class="explanation" id="explanation"></div>

<div class="btn-row" id="btnsBefore">
<button class="btn-skip" id="btnSkip">わからない</button>
<button class="btn-check" id="btnCheck">答え合わせ</button>
</div>
<div class="btn-row hidden" id="btnsAfter">
<button class="btn-speak" id="btnSpeak">🔊</button>
<button class="btn-next" id="btnNext">次の問題 ▶</button>
</div>

<div class="progress"><div class="progress-bar" id="bar" style="width:0%"></div></div>
<div class="reset-bar">
<button id="btnBack">← モード選択</button>
<button id="btnResetCur">このモードをリセット</button>
</div>
</div>

<div id="completeArea" class="complete hidden">
<h2>🎉 完了！</h2>
<p id="completeMsg">完了</p>
<button onclick="location.reload()">モード選択に戻る</button>
</div>

</main>
<footer class="site">出典: らくらくベトナム語 動画 #1</footer>
</div>

<script src="data.js"></script>
<script>
(function(){
  var MAX_ROUND = 5;
  var state = null, currentMode = null, selectedIdx = -1, isCorrect = false;

  function dataFor(mode){
    if(mode === "fill") return FILL_QUESTIONS;
    if(mode === "error") return ERROR_QUESTIONS;
    if(mode === "usage") return USAGE_QUESTIONS;
    return [];
  }
  function skey(mode){ return "vilt_rakuraku1_" + mode; }
  function loadSt(mode){ try{ var s = localStorage.getItem(skey(mode)); if(s) return JSON.parse(s); }catch(e){} return null; }
  function saveSt(mode, st){ try{ localStorage.setItem(skey(mode), JSON.stringify(st)); }catch(e){} }
  function initSt(mode){
    var d = dataFor(mode);
    return { round:1, queue:d.map(function(_,i){return i;}), nextQueue:[], done:[], idx:0, finished:false, total:d.length };
  }

  // ===== Voice =====
  var viVoice = null;
  function loadVoices(){
    var v = window.speechSynthesis.getVoices();
    viVoice = v.find(function(x){ return x.lang && x.lang.toLowerCase().indexOf("vi") === 0; });
    var el = document.getElementById("voiceInfo");
    if(!("speechSynthesis" in window)){ el.className="voice-info err"; el.textContent="❌ 音声未対応"; return; }
    if(viVoice){ el.className="voice-info"; el.innerHTML="✅ 音声: <b>"+viVoice.name+"</b>"; }
    else{ el.className="voice-info warn"; el.innerHTML="⚠️ ベトナム語音声なし"; }
  }
  function speak(text, btn){
    if(!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    var msg = new SpeechSynthesisUtterance(text);
    msg.lang="vi-VN"; msg.rate=0.85;
    if(viVoice) msg.voice = viVoice;
    if(btn) btn.classList.add("speaking");
    msg.onend = function(){ if(btn) btn.classList.remove("speaking"); };
    msg.onerror = function(){ if(btn) btn.classList.remove("speaking"); };
    window.speechSynthesis.speak(msg);
  }

  function renderModeMenu(){
    var menu = document.getElementById("modeMenu");
    menu.innerHTML = "";
    var modes = [
      {id:"fill", icon:"📝", title:"穴埋め選択", count:FILL_QUESTIONS.length},
      {id:"error", icon:"🔍", title:"間違い探し", count:ERROR_QUESTIONS.length},
      {id:"usage", icon:"📖", title:"単語の正しい使い方", count:USAGE_QUESTIONS.length}
    ];
    modes.forEach(function(m){
      var btn = document.createElement("button");
      var st = loadSt(m.id);
      var doneCount = st ? st.done.length : 0;
      var isDone = st && st.finished && doneCount === m.count;
      btn.className = isDone ? "done" : "";
      btn.innerHTML = "<div class='ic'>"+m.icon+"</div><div>"+m.title+"</div><div class='count'>◎ "+doneCount+" / "+m.count+" 問"+(isDone?" ✓":"")+"</div>";
      btn.addEventListener("click", function(){ start(m.id); });
      menu.appendChild(btn);
    });
  }

  function start(mode){
    currentMode = mode;
    state = loadSt(mode) || initSt(mode);
    if(state.finished){ state = initSt(mode); saveSt(mode, state); }
    document.getElementById("modeArea").classList.add("hidden");
    document.getElementById("learnArea").classList.remove("hidden");
    document.getElementById("completeArea").classList.add("hidden");
    render();
  }
  function back(){
    currentMode = null; state = null;
    document.getElementById("modeArea").classList.remove("hidden");
    document.getElementById("learnArea").classList.add("hidden");
    document.getElementById("completeArea").classList.add("hidden");
    renderModeMenu();
  }

  function curQ(){
    if(!state || state.queue.length === 0) return null;
    return dataFor(currentMode)[state.queue[state.idx]];
  }

  function modeLabel(){
    if(currentMode === "fill") return "穴埋め";
    if(currentMode === "error") return "間違い探し";
    return "正しい使い方";
  }

  function escapeHtml(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

  function render(){
    if(state.finished){ showComplete(); return; }
    var q = curQ(); if(!q) return;
    document.getElementById("qNo").textContent = "第"+q.n+"問";
    document.getElementById("qModeBadge").textContent = modeLabel();
    document.getElementById("s-round").textContent = state.round+" / "+MAX_ROUND;
    document.getElementById("s-remain").textContent = state.queue.length;
    document.getElementById("s-done").textContent = state.done.length+" / "+state.total;
    document.getElementById("bar").style.width = Math.round((state.done.length/state.total)*100)+"%";
    document.getElementById("qArea").classList.remove("revealed");

    selectedIdx = -1;
    isCorrect = false;

    var qBody = document.getElementById("qBody");
    var qJp = document.getElementById("qJp");
    var choicesEl = document.getElementById("choices");
    choicesEl.innerHTML = "";
    var labels = ["A","B","C","D"];

    if(currentMode === "fill"){
      // sentence: "( Mỗi ) nơi..." → 括弧内を空欄表示
      var sent = q.sentence.replace(/\(\s*([^)]+)\s*\)/g, '<span class="blank">___</span>');
      qBody.innerHTML = "<div class='qlabel'>空欄に入る語を選んでください</div><div class='qsentence'>"+sent+"</div>";
      qJp.textContent = q.jp;
      q.choices.forEach(function(c, ci){
        var btn = document.createElement("button");
        btn.innerHTML = "<span class='label'>"+labels[ci]+"</span><span class='body'>"+escapeHtml(c)+"</span>";
        btn.addEventListener("click", function(){ pickChoice(ci); });
        choicesEl.appendChild(btn);
      });
    }else if(currentMode === "error"){
      // sentence + 4 underlined parts
      var s = q.sentence;
      // Replace each underline with marked span
      q.underlines.forEach(function(u, ui){
        var label = labels[ui];
        var marker = '<span class="ul">'+escapeHtml(u)+'</span><sup style="color:#ef6c00;font-weight:700">('+label+')</sup>';
        var pos = s.indexOf(u);
        if(pos >= 0){
          s = s.substring(0,pos) + marker + s.substring(pos + u.length);
        }
      });
      qBody.innerHTML = "<div class='qlabel'>下線部の中で誤っている語を選んでください</div><div class='qsentence'>"+s+"</div>";
      qJp.textContent = q.jp;
      q.underlines.forEach(function(u, ui){
        var btn = document.createElement("button");
        btn.innerHTML = "<span class='label'>"+labels[ui]+"</span><span class='body'>"+escapeHtml(u)+"</span>";
        btn.addEventListener("click", function(){ pickChoice(ui); });
        choicesEl.appendChild(btn);
      });
    }else{
      // usage: keyword + 4 sentences
      qBody.innerHTML = "<div class='qlabel'>この語が正しく使われている文を選んでください</div><div class='qkeyword'>"+escapeHtml(q.keyword)+"</div><div class='qkeyword-jp'>("+escapeHtml(q.keywordJp)+")</div>";
      qJp.textContent = "正解の文の意味: " + q.jp[q.ans];
      q.sentences.forEach(function(s, si){
        var btn = document.createElement("button");
        btn.innerHTML = "<span class='label'>"+labels[si]+"</span><span class='body'>"+escapeHtml(s)+"</span>";
        btn.addEventListener("click", function(){ pickChoice(si); });
        choicesEl.appendChild(btn);
      });
    }

    document.getElementById("judge").classList.remove("show");
    document.getElementById("explanation").classList.remove("show");
    document.getElementById("btnsBefore").classList.remove("hidden");
    document.getElementById("btnsAfter").classList.add("hidden");
    window.scrollTo(0, 0);
  }

  function pickChoice(idx){
    selectedIdx = idx;
    var btns = document.querySelectorAll("#choices button");
    btns.forEach(function(b,i){ b.classList.remove("selected"); if(i === idx) b.classList.add("selected"); });
  }

  function showComplete(){
    document.getElementById("learnArea").classList.add("hidden");
    document.getElementById("completeArea").classList.remove("hidden");
    document.getElementById("completeMsg").textContent =
      state.done.length === state.total
        ? modeLabel()+" 全"+state.total+"問を ◎ で完了！"
        : MAX_ROUND+"周終了。◎ "+state.done.length+"/"+state.total+"問";
  }

  function doCheck(){
    var q = curQ(); if(!q) return;
    if(selectedIdx < 0){ alert("選択肢を選んでください"); return; }
    var btns = document.querySelectorAll("#choices button");
    var labels = ["A","B","C","D"];
    isCorrect = (selectedIdx === q.ans);
    btns.forEach(function(b, ci){
      b.classList.add("disabled");
      b.classList.remove("selected");
      if(ci === q.ans) b.classList.add("correct");
      if(ci === selectedIdx && !isCorrect) b.classList.add("wrong");
      // Add small annotation for usage mode
      if(currentMode === "usage"){
        var bodyEl = b.querySelector(".body");
        var annotation = "";
        if(ci === q.ans) annotation = q.jp[ci];
        else if(q.wrongFix && q.wrongFix[ci]) annotation = "→ " + q.wrongFix[ci] + " | " + q.jp[ci];
        if(annotation) bodyEl.innerHTML = bodyEl.innerHTML + "<small>"+escapeHtml(annotation)+"</small>";
      }
    });
    document.getElementById("qArea").classList.add("revealed");

    var jb = document.getElementById("judge");
    if(isCorrect){
      jb.className = "judge-box show correct";
      document.getElementById("judgeIcon").textContent = "◎";
      document.getElementById("judgeMsg").textContent = "正解！合格";
    }else{
      jb.className = "judge-box show wrong";
      document.getElementById("judgeIcon").textContent = "×";
      document.getElementById("judgeMsg").textContent = "不正解 → 次周";
    }

    var disp = document.getElementById("correctDisplay");
    if(currentMode === "fill"){
      disp.innerHTML = "<b>正解の文:</b><br>" + escapeHtml(q.sentence);
    }else if(currentMode === "error"){
      disp.innerHTML = "<b>正しい文:</b><br>" + escapeHtml(q.correctSentence) + "<br><b>正しい語:</b> " + escapeHtml(q.correctWord);
    }else{
      disp.innerHTML = "<b>正解の文 ("+labels[q.ans]+"):</b><br>" + escapeHtml(q.sentences[q.ans]);
    }

    var exp = document.getElementById("explanation");
    exp.innerHTML = "<b>📝 解説:</b> " + escapeHtml(q.explanation);
    exp.classList.add("show");

    document.getElementById("btnsBefore").classList.add("hidden");
    document.getElementById("btnsAfter").classList.remove("hidden");
  }

  function doSkip(){
    var q = curQ(); if(!q) return;
    isCorrect = false;
    selectedIdx = -1;
    var btns = document.querySelectorAll("#choices button");
    btns.forEach(function(b, ci){
      b.classList.add("disabled");
      if(ci === q.ans) b.classList.add("correct");
      if(currentMode === "usage"){
        var bodyEl = b.querySelector(".body");
        var annotation = "";
        if(ci === q.ans) annotation = q.jp[ci];
        else if(q.wrongFix && q.wrongFix[ci]) annotation = "→ " + q.wrongFix[ci] + " | " + q.jp[ci];
        if(annotation) bodyEl.innerHTML = bodyEl.innerHTML + "<small>"+escapeHtml(annotation)+"</small>";
      }
    });
    document.getElementById("qArea").classList.add("revealed");
    var jb = document.getElementById("judge");
    jb.className = "judge-box show wrong";
    document.getElementById("judgeIcon").textContent = "?";
    document.getElementById("judgeMsg").textContent = "スキップ → 次周";
    var disp = document.getElementById("correctDisplay");
    var labels = ["A","B","C","D"];
    if(currentMode === "fill"){
      disp.innerHTML = "<b>正解の文:</b><br>" + escapeHtml(q.sentence);
    }else if(currentMode === "error"){
      disp.innerHTML = "<b>正しい文:</b><br>" + escapeHtml(q.correctSentence) + "<br><b>正しい語:</b> " + escapeHtml(q.correctWord);
    }else{
      disp.innerHTML = "<b>正解の文 ("+labels[q.ans]+"):</b><br>" + escapeHtml(q.sentences[q.ans]);
    }
    var exp = document.getElementById("explanation");
    exp.innerHTML = "<b>📝 解説:</b> " + escapeHtml(q.explanation);
    exp.classList.add("show");
    document.getElementById("btnsBefore").classList.add("hidden");
    document.getElementById("btnsAfter").classList.remove("hidden");
  }

  function doNext(){
    var qi = state.queue[state.idx];
    if(isCorrect){ if(state.done.indexOf(qi) < 0) state.done.push(qi); }
    else{ if(state.nextQueue.indexOf(qi) < 0) state.nextQueue.push(qi); }
    state.queue.splice(state.idx, 1);
    if(state.idx >= state.queue.length){
      if(state.nextQueue.length === 0 || state.round >= MAX_ROUND) state.finished = true;
      else{ state.round++; state.queue = state.nextQueue; state.nextQueue = []; state.idx = 0; }
    }
    saveSt(currentMode, state);
    render();
  }

  document.getElementById("btnCheck").addEventListener("click", doCheck);
  document.getElementById("btnSkip").addEventListener("click", doSkip);
  document.getElementById("btnNext").addEventListener("click", doNext);
  document.getElementById("btnSpeak").addEventListener("click", function(){
    var q = curQ(); if(!q) return;
    var text = "";
    if(currentMode === "fill") text = q.sentence.replace(/\(\s*([^)]+)\s*\)/g, '$1');
    else if(currentMode === "error") text = q.correctSentence;
    else text = q.sentences[q.ans];
    speak(text, document.getElementById("btnSpeak"));
  });
  document.getElementById("btnBack").addEventListener("click", back);
  document.getElementById("btnResetCur").addEventListener("click", function(){
    if(confirm("このモードをリセット?")){ state = initSt(currentMode); saveSt(currentMode, state); render(); }
  });
  document.getElementById("btnResetAll").addEventListener("click", function(){
    if(confirm("全進捗リセット?")){
      ["fill","error","usage"].forEach(function(m){ localStorage.removeItem(skey(m)); });
      renderModeMenu();
    }
  });

  if("speechSynthesis" in window){
    loadVoices();
    if(window.speechSynthesis.onvoiceschanged !== undefined){
      window.speechSynthesis.onvoiceschanged = loadVoices;
    }
  }
  renderModeMenu();
})();
</script>
</body>
</html>
